# ═════════════════════════════════════════════════════════════════════════════
# FLUJO 02 · Panel principal — los números del mes
# ═════════════════════════════════════════════════════════════════════════════
# Verifica que la pantalla principal muestre LA VERDAD sobre el mes.
#
# ─────────────────────────────────────────────────────────────────────────────
# REQUISITO: LOS DATOS SEMBRADOS
# ─────────────────────────────────────────────────────────────────────────────
# Este flujo NO crea datos: comprueba que la interfaz muestre bien los que ya
# existen. Antes de correrlo hay que sembrarlos:
#
#     node scripts/smoke.mjs --reset
#
# El escenario sembrado (ver scripts/smoke.mjs) es el caso que motivó todo el
# rediseño:
#
#   · Banco Galicia arranca con $ 100.000
#   · Préstamo de $ 500.000 al 60% TNA en 12 cuotas, desembolsado el 30/09
#   · Octubre: sueldo $ 800.000, gastos $ 490.000, y la cuota 1 del préstamo
#
# Los valores de las aserciones están calculados a mano en los comentarios. Si
# un cambio en la lógica los rompe, el flujo dice CUÁL cambió.
#
# El flujo de caja (la tarjeta nueva) tiene SUS propios números, distintos de
# "Te quedó" en cuanto hay deuda de por medio:
#
#   · Octubre:    +328.587,29  (310.000 + 50.000 de la tarjeta − 31.412,71 del
#                              capital de la cuota: la ropa NO salió de una
#                              cuenta y el capital SÍ, aunque no sea gasto)
#   · Septiembre: +500.000,00  (el desembolso entra a la caja; el ahorro es CERO)
#   · Agosto:        $ 0,00    (sin movimientos: "Sin transferencias este mes")
#
# ─────────────────────────────────────────────────────────────────────────────
# LAS DOS REGLAS DE ESCRITURA DE LOS PATRONES
# ─────────────────────────────────────────────────────────────────────────────
# 1. MAESTRO COMPARA CONTRA EL TEXTO COMPLETO DEL ELEMENTO.
#    No busca el patrón adentro del texto. El elemento dice `$ 800.000,00`, así
#    que la aserción
#
#        assertVisible: '800\.000,00'
#
#    FALLA — y falla por el motivo equivocado, porque el número está bien y el
#    elemento existe. Hay que envolver el patrón:
#
#        assertVisible: '.*800\.000,00.*'
#
#    El flujo 00 es la sonda que verifica esto; si algún día esa sonda empieza a
#    fallar, los comodines dejaron de ser necesarios.
#
# 2. EL PUNTO VA ESCAPADO.
#    Maestro interpreta el texto como expresión regular y un punto suelto
#    significa "cualquier carácter". Sin escapar, `.*50.000,00.*` también da por
#    buena una pantalla que muestra `450.000,00`: la aserción pasaría por el
#    motivo equivocado, que es la peor forma de pasar.
#
# Se usan comillas simples de YAML porque en las dobles la barra invertida activa
# secuencias de escape y `"\."` no es una secuencia válida: YAML daría error
# antes de que Maestro llegue a ver el texto.
#
# ─────────────────────────────────────────────────────────────────────────────
# POR QUÉ NO SE AFIRMA SOBRE "$ 800.000,00" COMPLETO
# ─────────────────────────────────────────────────────────────────────────────
# `Intl.NumberFormat` separa el símbolo del número con un espacio que NO es el
# espacio normal: es U+00A0 (espacio duro). Verificado ejecutando el formateador
# de verdad:
#
#     "$ 800.000,00"  →  $ U+00A0 8 0 0 ...
#
# Una aserción con un espacio común no coincidiría, y el fallo parecería un
# problema de la app cuando es de la aserción. Los `.*` cubren ese carácter
# invisible sin nombrarlo.

url: http://127.0.0.1:3000
name: "02 · Panel principal — los números del mes"
tags:
  - smoke
  - panel
env:
  BASE: "http://127.0.0.1:3000"

---
# ─────────────────────────────────────────────────────────────────────────────
# ENTRAR: NORMALIZANDO LA SESIÓN PRIMERO
# ─────────────────────────────────────────────────────────────────────────────
# Maestro COMPARTE el perfil de Chrome dentro de una misma corrida, así que las
# cookies persisten de un flow al siguiente. El flow anterior muy probablemente
# dejó la sesión abierta.
#
# Si se llegara al panel en lugar del login, `tapOn id: password` falla con
# "Element not found" — un mensaje que apunta al formulario cuando el problema es
# que nunca se llegó a él. Y peor: el flow siguiente hereda la misma sesión y
# falla igual, así que un solo descuido tumba la suite entera en cascada.
#
# Por eso cada flow que necesita sesión la construye desde cero en vez de
# heredarla: cerrar (si hace falta) y volver a entrar. Cuesta dos navegaciones y
# compra que el resultado de un flow no dependa de cuál corrió antes.
- openLink: "${BASE}"

- runFlow:
    when:
      visible: "Salir"
    commands:
      - tapOn: "Salir"

- extendedWaitUntil:
    visible: "Entrar"
    timeout: 60000

- tapOn:
    id: "password"
- inputText: "${APP_PASSWORD}"
- tapOn: "Entrar"

- extendedWaitUntil:
    visible: "Patrimonio neto.*"
    timeout: 90000

# ── Las cuatro tarjetas del mes ──────────────────────────────────────────────
# Ingresos: sólo el sueldo. El desembolso del préstamo NO está acá — es una
# transferencia, y esa distinción es TODO el rediseño.
- assertVisible: '.*800\.000,00.*'

# Gastos: 250.000 + 120.000 + 45.000 + 50.000 + 25.000 = 490.000
# El 25.000 es el INTERÉS de la cuota, que es el único costo real del préstamo.
- assertVisible: '.*490\.000,00.*'

# 800.000 − 490.000 = 310.000. Va con el signo: es la tarjeta "Te quedó", y el
# signo es parte de lo que la pantalla tiene que decir.
- assertVisible: '.*\+\$.*310\.000,00.*'

# 310.000 / 800.000 = 38,75%
- assertVisible: ".*Ahorraste 38,75%.*"

# ── La tarjeta "Flujo de caja" (liquidez) ────────────────────────────────────
#
# Éste es el número que responde "¿cuánta plata entró y salió de mis cuentas?",
# y NO es el mismo que "Te quedó": con deuda de por medio, los dos se separan
# — y ésos son los dos números del rediseño.
#
#   Entradas: 800.000,00                    (sueldo → banco)
#   Salidas:  250.000 + 120.000 + 45.000    (gastos que salieron del banco)
#           + 25.000,00                     (interés de la cuota)
#           + 31.412,71                     (capital de la cuota, banco → préstamo)
#   Flujo:    800.000,00 − 471.412,71 = +328.587,29
#
# La compra con tarjeta (50.000) está en los gastos del mes pero NO sale de
# ninguna cuenta hasta que se pague el resumen; el capital de la cuota sale de
# la caja pero no es un gasto. Por eso:
#
#     310.000,00 (ahorro) + 50.000,00 − 31.412,71 = 328.587,29 (liquidez)
#
# Las dos tarjetas tienen que convivir en la MISMA pantalla sin pisarse.
- assertVisible: "Flujo de caja"
- assertVisible: '.*\+\$.*328\.587,29.*'

# Y el detalle dice cuántas transferencias explican la diferencia con "Te
# quedó". Este contador vivía antes en la línea del mes ("7 movimientos · 1
# transferencia") y ahora vive acá; el encabezado quedó sólo con "7 movimientos".
- assertVisible: ".*1 transferencia entre tus cuentas.*"

# ── Patrimonio neto ──────────────────────────────────────────────────────────
# 100.000 (ahorros previos, ya en el banco) + 800.000 − 490.000 = 410.000
#
# Éste es el número que el modelo viejo NO podía calcular bien. Antes, el
# desembolso del préstamo entraba como ingreso y la cuota entera como gasto, y
# el patrimonio terminaba inflado.
- assertVisible: '.*410\.000,00.*'

# Activos: los $ 928.587,29 del banco (el efectivo quedó en 0).
- assertVisible: '.*928\.587,29.*'

# Deudas: 468.587,29 del préstamo + 50.000 de la tarjeta = 518.587,29
- assertVisible: '.*518\.587,29.*'

# ── Los saldos por cuenta, en la lista y en POSITIVO ─────────────────────────
# La tarjeta debe 50.000 y el préstamo 468.587,29. Se muestran SIN el signo
# menos: "debe $ 50.000,00" se lee bien, "−$ 50.000,00" se lee como un error de
# la app. La palabra "debe" es parte de lo que se verifica.
- assertVisible: '.*debe.*50\.000,00.*'
- assertVisible: '.*debe.*468\.587,29.*'

# ── La reconciliación visible: ΔPatrimonio = Ahorro ──────────────────────────
#
# El control de integridad del mes: la variación del patrimonio (los saldos)
# contra el ahorro del mes (los movimientos). En octubre los dos caminos dan el
# MISMO número — 100.000 de cierre de septiembre a 410.000 de cierre de octubre
# son +310.000,00, y el sueldo menos los gastos son 800.000 − 490.000 — así que
# la diferencia tiene que mostrarse en $ 0,00 y la frase "cuadra al centavo".
#
# El bloque vive DEBAJO del pliegue (después de la serie mensual), así que hay
# que scrollear hasta su ÚLTIMA línea: la explicación de los dos caminos. Es el
# corolario de la trampa 10 — anclar en el último dato deja visibles todos los
# de arriba.
- scrollUntilVisible:
    element:
      text: ".*Dos caminos independientes.*"
    direction: DOWN
    timeout: 30000

- assertVisible: ".*Reconciliación.*octubre de 2026.*"

# Las dos fotos de la comparación: el cierre de septiembre y el de octubre.
# La frase completa "de $ 100.000,00 a $ 410.000,00" sólo existe en este
# bloque; los montos sueltos también aparecen en las celdas de la serie.
- assertVisible: '.*de.*100\.000,00.*a.*410\.000,00.*'

- assertVisible: ".*Ahorro del mes.*"

# El veredicto del mes: $ 0,00 de diferencia. La FRASE es el ancla fuerte y no
# el monto: "$ 0,00" también lo muestra el saldo del efectivo, así que por sí
# solo la aserción pasaría por el motivo equivocado. Si la reconciliación
# dejara de cuadrar, esta frase desaparece y el test lo dice.
- assertVisible: ".*cuadra al centavo.*"

# ─────────────────────────────────────────────────────────────────────────────
# VOLVER ARRIBA PARA SEGUIR CON LA NAVEGACIÓN
# ─────────────────────────────────────────────────────────────────────────────
# El scroll de arriba bajó la vista; `tapOn` no scrollea nunca (trampa 9), así
# que el botón de mes anterior —arriba de todo— hay que volver a alcanzarlo
# scrolleando hacia arriba, anclando en un id y no en un texto: el título de la
# reconciliación también dice "octubre de 2026" y satisfaría el patrón antes de
# llegar al encabezado.
- scrollUntilVisible:
    element:
      id: "btn-next-month"
    direction: UP
    timeout: 30000

# ── El desembolso NO es un ingreso: la prueba de fuego ───────────────────────
#
# Se navega al mes anterior, donde ocurrió el desembolso del préstamo. Si el
# modelo estuviera mal, septiembre mostraría $ 500.000 de ingresos — "ganaste
# medio millón" — cuando en realidad te endeudaste por medio millón.
#
# Es la demostración más limpia de todo el rediseño y se hace desde la
# interfaz, sin mirar la base.
#
# Se navega ANTES de scrollear a propósito: el botón está arriba de todo y
# Maestro no hace scroll automático para encontrar un elemento.
- tapOn:
    id: "btn-prev-month"

- extendedWaitUntil:
    visible: ".*septiembre de 2026.*"
    timeout: 30000

# Lo único que pasó en septiembre es la transferencia de $ 500.000 del préstamo
# al banco. Se ve, porque es un movimiento real.
#
# ─────────────────────────────────────────────────────────────────────────────
# EL ORDEN ACÁ NO ES CASUAL
# ─────────────────────────────────────────────────────────────────────────────
# Las aserciones de "NO visible" van ANTES de scrollear, y esto es una trampa:
# `assertNotVisible` también da por buena una pantalla donde el elemento existe
# pero quedó fuera de la vista. Si se scrollea primero, las aserciones de abajo
# pasarían SIEMPRE —incluso si el desembolso volviera a contarse como ingreso—
# porque las tarjetas del mes ya no estarían en pantalla.
#
# Una aserción negativa que pasa por el motivo equivocado es peor que no tenerla:
# da confianza sin verificar nada.
#
# Los chequeos de este bloque van con la página arriba de todo, donde las
# tarjetas se ven de verdad.
- extendedWaitUntil:
    visible: ".*septiembre de 2026.*"
    timeout: 30000

# El mes tiene un solo movimiento, y es una transferencia.
- assertVisible: ".*1 movimiento.*"

# ── La tarjeta de flujo en septiembre: +500.000 sin ser ingreso ─────────────
#
# El desembolso ENTRA a la caja (préstamo → banco): la liquidez del mes es
# +500.000,00 mientras el ahorro es CERO. Ésta es la combinación que ninguna
# otra pantalla muestra: plata disponible que no es plata ganada.
#
# El `\+\$` de la aserción es lo que la hace precisa: la fila de la lista
# muestra "$ 500.000,00" sin signo, así que exigir el "+$" adelante sólo lo
# puede cumplir la tarjeta de flujo.
- assertVisible: '.*\+\$.*500\.000,00.*'

# El detalle cuenta la transferencia que explica ese número.
- assertVisible: ".*1 transferencia entre tus cuentas.*"

# Y "Te quedó" muestra cero: el desembolso NO es un ingreso. Ésta es la
# aserción que distingue el modelo correcto del viejo — con el desembolso
# contado como ingreso, acá diría "Ahorraste 100,00%" y el cartel de "Sin
# ingresos este mes" no existiría.
- assertVisible: ".*Sin ingresos este mes.*"

# Y NO se ve como ingreso ni como gasto. Si alguna de estas aserciones falla,
# el modelo volvió a tratar el desembolso como plata ganada.
- assertNotVisible: '.*800\.000,00.*'
- assertNotVisible: '.*490\.000,00.*'

# ── La fila de la transferencia, en la lista ─────────────────────────────────
#
# ─────────────────────────────────────────────────────────────────────────────
# EL ANCLA DEL SCROLL ES LA FILA, NO EL MONTO
# ─────────────────────────────────────────────────────────────────────────────
# Antes acá se scrolleaba hasta ".*500\.000,00.*" y alcanzaba porque ese monto
# sólo podía estar en la fila. Desde que la tarjeta de flujo muestra
# "+$ 500.000,00" arriba de todo, ese ancla quedó ambigua: el scroll puede
# satisfacerse con la tarjeta (que ya estaba a la vista) y dar por buena una
# lista que nunca se miró. El ancla ahora es la DESCRIPCIÓN de la fila —el
# único texto que prueba que el movimiento se renderizó— y ninguna tarjeta
# puede satisfacerla.
- scrollUntilVisible:
    element:
      text: ".*Desembolso del préstamo.*"
    direction: DOWN
    timeout: 30000

- assertVisible: ".*Desembolso del préstamo.*"

# ── Volver a octubre y mirar la lista de movimientos ─────────────────────────
#
# ─────────────────────────────────────────────────────────────────────────────
# VOLVER ARRIBA: `tapOn` NO ENCUENTRA LO QUE ESTÁ FUERA DE LA VISTA
# ─────────────────────────────────────────────────────────────────────────────
# Después del scroll, los botones de mes quedaron arriba, fuera de la pantalla.
# `tapOn` no scrollea para buscar su blanco: falla con
#
#     Element not found: Id matching regex: btn-next-month
#
# que suena a que el botón no existe. Existe — está unos cientos de píxeles más
# arriba. Ésta es la contracara exacta de la trampa 7:
#
#   · `assertNotVisible` aprueba DE MÁS cuando hay scroll (el elemento está, pero
#     fuera de la vista, así que la negación se cumple sola).
#   · `tapOn` falla DE MÁS por el mismo motivo.
#
# Las dos se arreglan cuidando el orden: scrollear sólo para mirar, y volver
# arriba antes de tocar.
- scrollUntilVisible:
    element:
      id: "btn-next-month"
    direction: UP
    timeout: 30000

- tapOn:
    id: "btn-next-month"

- extendedWaitUntil:
    visible: ".*octubre de 2026.*"
    timeout: 30000

- assertVisible: ".*7 movimientos.*"

# ── La lista de movimientos, en el orden en que se ve ────────────────────────
#
# ─────────────────────────────────────────────────────────────────────────────
# SCROLL HACIA ABAJO ES UNA CALLE DE UN SOLO SENTIDO
# ─────────────────────────────────────────────────────────────────────────────
# `scrollUntilVisible` con `direction: DOWN` sólo va hacia abajo: si el elemento
# que busca quedó MÁS ARRIBA de donde está parado, no lo va a encontrar nunca.
# Falla con
#
#     No visible element found: ".*Cuota 1 · interés.*"
#
# que suena a que el dato no está en la pantalla. Está — unos cientos de píxeles
# más arriba.
#
# Por eso las aserciones van en el orden REAL de la lista, de arriba abajo. Y ese
# orden no es un detalle del test: es el orden que ve el usuario, y verifica que
# la lista esté ordenada por fecha descendente.
#
# La lista de octubre, tal como la devuelve la API (`date desc, createdAt desc`):
#
#     0  15 oct  EXPENSE    25.000,00   Cuota 1 · interés
#     1  15 oct  TRANSFER   31.412,71   Cuota 1 · capital
#     2  12 oct  EXPENSE    50.000,00   Compra con tarjeta
#     3  08 oct  EXPENSE    45.000,00   (Transporte)
#     4  05 oct  EXPENSE   120.000,00   (Supermercado)
#     5  03 oct  EXPENSE   250.000,00   Alquiler de octubre
#     6  01 oct  INCOME    800.000,00   Sueldo de octubre
#
# Las descripciones viven al final de cada fila y la lista arranca debajo del
# pliegue (la pantalla de los tests mide 1018×597), así que cada una necesita su
# propio scroll.

# La cuota del préstamo aparece como DOS movimientos, y así es correcto: el
# interés es gasto y el capital es una transferencia que baja la deuda. Un modelo
# que no distingue los dos no puede decir cuánto costó el préstamo de verdad.
- scrollUntilVisible:
    element:
      text: ".*Cuota 1 · interés.*"
    direction: DOWN
    timeout: 30000

- scrollUntilVisible:
    element:
      text: ".*Cuota 1 · capital.*"
    direction: DOWN
    timeout: 30000

# La compra con tarjeta es un gasto que tiene a la tarjeta como cuenta de origen:
# sube la deuda, no sale de ningún banco. Si el modelo la tratara como una
# transferencia, el gasto del mes bajaría y el patrimonio no se movería.
- scrollUntilVisible:
    element:
      text: ".*Compra con tarjeta.*"
    direction: DOWN
    timeout: 30000

# Y al final de todo los dos más viejos: la lista va de la fecha más nueva a la
# más vieja, así que el sueldo del día 1 es la última fila.
- scrollUntilVisible:
    element:
      text: ".*Alquiler de octubre.*"
    direction: DOWN
    timeout: 30000

- scrollUntilVisible:
    element:
      text: ".*Sueldo de octubre.*"
    direction: DOWN
    timeout: 30000

# ── Agosto: un mes sin movimientos y sin transferencias ──────────────────────
#
# ─────────────────────────────────────────────────────────────────────────────
# VOLVER ARRIBA SIN CHOCARSE CON EL HEADER PEGAJOSO (trampa 12)
# ─────────────────────────────────────────────────────────────────────────────
# Venimos scrolleados al fondo de la lista y los botones de mes están arriba de
# todo. `scrollUntilVisible` hacia arriba frena apenas el elemento entra al
# viewport, y si entra pegado al borde superior queda DETRÁS del header sticky:
# Maestro lo da por visible, el tap se lo come el header y el error aparece en
# el paso siguiente. Por eso `centerElement: true`: el selector queda centrado,
# lejos del header, y el tap llega.
#
# ─────────────────────────────────────────────────────────────────────────────
# EL ANCLA ES EL ID, NO LA ETIQUETA DEL MES — Y SIN `centerElement`
# ─────────────────────────────────────────────────────────────────────────────
# Dos trampas en un solo paso:
#
# 1. La etiqueta del mes quedó AMBIGUA. Antes se anclaba en
#    `.*octubre de 2026.*` y alcanzaba. Desde que existe el bloque de
#    reconciliación, su título —"Reconciliación · octubre de 2026"— también
#    satisface ese patrón, y vive MÁS ABAJO en la página: el scroll hacia
#    arriba se detiene apenas ese título entra al viewport, con los botones
#    todavía fuera de la vista, y el `tapOn` de abajo fallaba con
#
#        Element not found: Id matching regex: btn-prev-month
#
#    el mismo síntoma engañoso de la trampa 9, pero por un ancla ambigua.
#    `btn-next-month` es un id que SÓLO tiene el selector del mes: el scroll no
#    se puede satisfacer en ningún otro lado.
#
# 2. Centrarlo es IMPOSIBLE: el selector es la PRIMERA fila de la página, así
#    que en `scrollTop = 0` su techo es `y ≈ 97`. `centerElement: true` exige
#    el centro del viewport (~278), que nunca alcanza: Maestro reintenta hasta
#    el timeout y FALLA con
#
#        No visible element found: id: btn-next-month
#
#    que miente — el botón está visible al 100%. Sin `centerElement` la
#    condición es la correcta (100% visible) y el scroll termina en el tope
#    real de la página, con el selector despejado debajo del header.
- scrollUntilVisible:
    element:
      id: "btn-next-month"
    direction: UP
    timeout: 30000

- tapOn:
    id: "btn-prev-month"

- extendedWaitUntil:
    visible: ".*septiembre de 2026.*"
    timeout: 30000

- tapOn:
    id: "btn-prev-month"

- extendedWaitUntil:
    visible: ".*agosto de 2026.*"
    timeout: 30000

# Agosto no tuvo NINGÚN movimiento: el encabezado dice cero y la tarjeta de
# flujo muestra 0,00 con su detalle sin transferencias. El detalle es la
# aserción fuerte: "Sin transferencias este mes" sólo aparece cuando el
# contador del servidor es cero.
- assertVisible: ".*0 movimientos.*"
- assertVisible: ".*Sin transferencias este mes.*"

# ─────────────────────────────────────────────────────────────────────────────
# QUÉ **NO** PUEDE APARECER EN AGOSTO (antes de scrollear: trampa 7)
# ─────────────────────────────────────────────────────────────────────────────
# El saldo del banco NO se verifica acá a propósito: el patrimonio y los saldos
# por cuenta son de HOY, no del mes que estás mirando (el panel los pide sin
# `asOf`), así que en agosto siguen mostrando los números actuales. Lo que sí
# es del mes son las tarjetas de arriba, y ésas no pueden mostrar ni el
# desembolso de septiembre ni el flujo de octubre.
- assertNotVisible: '.*500\.000,00.*'
- assertNotVisible: '.*328\.587,29.*'

# La lista de agosto muestra su estado vacío, con el empujón a cargar algo.
- scrollUntilVisible:
    element:
      text: "Sin movimientos este mes"
    direction: DOWN
    timeout: 30000

- assertVisible: "Sin movimientos este mes"
